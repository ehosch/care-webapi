services:
  api:
    build:
      context: .
      dockerfile: src/Host/Dockerfile
    container_name: care-webapi
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=8080
      - DatabaseSettings__ConnectionString=${DB_CONNECTION_STRING}
      - HangfireSettings__Storage__ConnectionString=${DB_CONNECTION_STRING}
      - HangfireSettings__Credentials__User=Admin
      - HangfireSettings__Credentials__Password=${HANGFIRE_PASSWORD}
      - HangfireSettings__Route=/jobs
      - HangfireSettings__Dashboard__AppPath=/
      - HangfireSettings__Dashboard__StatsPollingInterval=2000
      - HangfireSettings__Dashboard__DashboardTitle=Jobs
      - MailSettings__Host=${MAIL_HOST}
      - MailSettings__Port=${MAIL_PORT}
      - MailSettings__From=${MAIL_FROM}
      - MailSettings__DisplayName=Care Coordination
      - SecuritySettings__RequireConfirmedAccount=false
      - SecuritySettings__JwtSettings__Key=${JWT_KEY}
      - SecuritySettings__JwtSettings__TokenExpirationInMinutes=10080
      - SecuritySettings__JwtSettings__RefreshTokenExpirationInDays=30
      - SecuritySettings__DefaultAdmin__Email=${DEFAULT_ADMIN_EMAIL}
      - SecuritySettings__DefaultAdmin__Password=${DEFAULT_ADMIN_PASSWORD}
      - SmsSettings__AccountSid=${TWILIO_ACCOUNT_SID}
      - SmsSettings__AuthToken=${TWILIO_AUTH_TOKEN}
      - SmsSettings__FromNumber=${TWILIO_FROM_NUMBER}
      - CorsSettings__Blazor=${CORS_BLAZOR}
    ports:
      - "5010:8080"
    networks:
      - care-mysql_default
    restart: on-failure

networks:
  care-mysql_default:
    external: true
